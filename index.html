<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Match-3 - 500 Levels</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 15px;
        }
        .hidden {
            display: none !important;
        }
        /* Level Map Screen */
        #levelMapScreen {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 2px solid #ff5500;
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.6);
            width: 95%;
            max-width: 450px;
            height: 85vh;
            max-height: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        .map-header h2 {
            margin: 0;
            font-size: 1.4rem;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0,255,255,0.6);
        }
        .levels-container {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding-right: 5px;
        }
        .levels-container::-webkit-scrollbar {
            width: 6px;
        }
        .levels-container::-webkit-scrollbar-thumb {
            background: #ff5500;
            border-radius: 3px;
        }
        .level-btn {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(255,85,0,0.8), rgba(200,50,0,0.9));
            border: 2px solid #ffaa00;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        .level-btn.locked {
            background: rgba(50, 50, 60, 0.7);
            border-color: #666;
            color: #888;
            cursor: not-allowed;
        }
        .level-btn:not(.locked):active {
            transform: scale(0.92);
        }

        /* Game Screen */
        .game-container {
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            align-items: center;
        }
        .stats-panel {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: linear-gradient(135deg, #ff5500, #ff8800);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(255, 85, 0, 0.4);
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        
        /* Main Layout: Boosters on Left, Board on Center */
        .main-layout {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
            justify-content: center;
        }
        .boosters-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            align-items: center;
        }
        .booster-btn {
            background: linear-gradient(135deg, #0055ff, #00bbff);
            border: 2px solid #00ffff;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            position: relative;
            transition: transform 0.1s;
        }
        .booster-btn:active {
            transform: scale(0.92);
        }
        .booster-btn.active {
            border-color: #ff5500;
            box-shadow: 0 0 15px #ff5500;
            background: linear-gradient(135deg, #ff5500, #ffaa00);
        }
        .booster-count {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: #111;
            color: #00ffff;
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 6px;
            border: 1px solid #00ffff;
        }

        .board-wrapper {
            padding: 6px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 20px #ff5500, inset 0 0 15px #00ffff;
            border: 2px solid #ff5500;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 320px;
            height: 320px;
            max-width: 75vw;
            max-height: 75vw;
        }
        .tile {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }
        .tile img {
            width: 92%;
            height: 92%;
            object-fit: contain;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.6));
            pointer-events: none;
            transition: transform 0.2s;
        }
        .tile.selected {
            transform: scale(1.08);
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px #00ffff, inset 0 0 8px rgba(255,255,255,0.8);
            z-index: 2;
        }
        .tile.special-rocket::after {
            content: '🚀';
            position: absolute;
            font-size: 12px;
            bottom: 2px;
            right: 2px;
            filter: drop-shadow(0 1px 2px #000);
        }
        .tile.special-bomb::after {
            content: '💣';
            position: absolute;
            font-size: 12px;
            bottom: 2px;
            right: 2px;
            filter: drop-shadow(0 1px 2px #000);
        }
        .level-info-bar {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.9rem;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
            padding: 0 5px;
        }
    </style>
</head>
<body>
    <audio id="bgMusic" src="Music.mp3" loop></audio>
    
    <!-- Level Map Screen (500 Levels) -->
    <div id="levelMapScreen" class="screen">
        <div class="map-header">
            <h2>Mars Sectors (500 Levels)</h2>
            <button class="btn" id="soundToggleMap">🔊</button>
        </div>
        <div class="levels-container" id="levelsGrid">
            <!-- Dynamically generated 500 level buttons -->
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-container">
            <div class="header">
                <div class="stats-panel">
                    <span>Lvl: <strong id="level">1</strong></span>
                    <span>Score: <strong id="score">0</strong></span>
                    <span>Moves: <strong id="moves">25</strong></span>
                </div>
                <div class="controls">
                    <button class="btn" id="soundToggleGame">🔊</button>
                    <button class="btn" id="mapBtn">🗺️ Map</button>
                    <button class="btn" id="restartBtn">🔄</button>
                </div>
            </div>
            
            <div class="main-layout">
                <!-- Left Boosters Panel -->
                <div class="boosters-panel">
                    <button class="booster-btn" id="rocketBooster" title="Rocket Booster">
                        🚀
                        <span class="booster-count" id="rocketCount">3</span>
                    </button>
                    <button class="booster-btn" id="bombBooster" title="Bomb Booster">
                        💣
                        <span class="booster-count" id="bombCount">3</span>
                    </button>
                </div>
                
                <!-- Central Game Board -->
                <div class="board-wrapper">
                    <div class="grid" id="grid"></div>
                </div>
            </div>
            
            <div class="level-info-bar">
                <span>Target: <span id="targetScore">800</span> pts</span>
                <span>Goal: Match & Clear</span>
            </div>
        </div>
    </div>
</body>
<script>
    // Web Audio API Sound Effects
    let audioCtx = null;
    let soundEnabled = true;
    const bgMusic = document.getElementById('bgMusic');

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!soundEnabled) return;
        initAudioContext();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'swap') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(450, now + 0.1);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'match') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554.37, now + 0.08);
            osc.frequency.setValueAtTime(659.25, now + 0.16);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'special' || type === 'booster') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
            gainNode.gain.setValueAtTime(0.25, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
        }
    }

    // Real Image Asset Mapping
    const candyImages = [
        'rock.png',    // 0: Red Mars Rock
        'crystal.png', // 1: Purple Crystal
        'solar.png',   // 2: Blue Solar Panel
        'rover.png',   // 3: Green Mars Rover
        'helmet.png',  // 4: Astronaut Helmet
        'water.png'    // 5: Water Canister
    ];

    const width = 8;
    const grid = document.getElementById('grid');
    const scoreDisplay = document.getElementById('score');
    const movesDisplay = document.getElementById('moves');
    const levelDisplay = document.getElementById('level');
    const targetScoreDisplay = document.getElementById('targetScore');
    const levelsGrid = document.getElementById('levelsGrid');
    
    const levelMapScreen = document.getElementById('levelMapScreen');
    const gameScreen = document.getElementById('gameScreen');

    const soundToggleMap = document.getElementById('soundToggleMap');
    const soundToggleGame = document.getElementById('soundToggleGame');
    const mapBtn = document.getElementById('mapBtn');
    const restartBtn = document.getElementById('restartBtn');

    const rocketBoosterBtn = document.getElementById('rocketBooster');
    const bombBoosterBtn = document.getElementById('bombBooster');
    const rocketCountDisplay = document.getElementById('rocketCount');
    const bombCountDisplay = document.getElementById('bombCount');

    let squares = [];
    let score = 0;
    let moves = 25;
    let currentLevel = 1;
    let targetScore = 800;
    let maxUnlockedLevel = parseInt(localStorage.getItem('mars_match_max_level')) || 1;
    
    let selectedTile = null;
    let selectedIndex = null;
    let isProcessing = false;

    let activeBooster = null; // 'rocket' or 'bomb'
    let rocketCount = 3;
    let bombCount = 3;

    // Task 3: 500 Levels Generator
    let levelsConfig = [];
    function generate500Levels() {
        levelsConfig = [];
        for (let i = 1; i <= 500; i++) {
            // Difficulty scaling: moves decrease from 25 down to 12
            let lvlMoves = Math.max(12, Math.floor(25 - (i - 1) * 13 / 499));
            // Target score increases progressively
            let lvlTarget = 800 + (i - 1) * 150;
            // Tile types available increase or remain all 6
            let activeTypes = Math.min(6, 4 + Math.floor(i / 150));
            
            levelsConfig.push({
                level: i,
                moves: lvlMoves,
                targetScore: lvlTarget,
                tileTypes: activeTypes
            });
        }
    }

    function renderLevelMap() {
        levelsGrid.innerHTML = '';
        for (let i = 1; i <= 500; i++) {
            const btn = document.createElement('button');
            btn.classList.add('level-btn');
            btn.innerText = i;
            if (i > maxUnlockedLevel) {
                btn.classList.add('locked');
            } else {
                btn.addEventListener('click', () => {
                    loadLevel(i);
                });
            }
            levelsGrid.appendChild(btn);
        }
    }

    function loadLevel(lvlNum) {
        currentLevel = lvlNum;
        const config = levelsConfig[lvlNum - 1];
        moves = config.moves;
        targetScore = config.targetScore;
        score = 0;
        
        levelDisplay.innerText = currentLevel;
        movesDisplay.innerText = moves;
        targetScoreDisplay.innerText = targetScore;
        
        rocketCount = 3;
        bombCount = 3;
        updateBoosterCounts();
        
        levelMapScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        
        createBoard(config.tileTypes);
    }

    function createBoard(numTypes = 6) {
        grid.innerHTML = '';
        squares = [];
        for (let i = 0; i < width * width; i++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.setAttribute('data-id', i);
            
            let randomCandy;
            do {
                randomCandy = Math.floor(Math.random() * numTypes);
                tile.dataset.candy = randomCandy;
            } while (
                (i % width >= 2 && squares[i - 1]?.dataset.candy == randomCandy && squares[i - 2]?.dataset.candy == randomCandy) ||
                (i >= width * 2 && squares[i - width]?.dataset.candy == randomCandy && squares[i - width * 2]?.dataset.candy == randomCandy)
            );

            const img = document.createElement('img');
            img.src = candyImages[randomCandy];
            tile.appendChild(img);

            tile.addEventListener('click', handleTileClick);
            grid.appendChild(tile);
            squares.push(tile);
        }
    }

    function handleTileClick() {
        if (isProcessing) return;
        initAudioContext();
        const clickedIndex = parseInt(this.getAttribute('data-id'));

        // Handle Active Booster
        if (activeBooster) {
            useBoosterOnTile(clickedIndex);
            return;
        }

        if (selectedIndex === null) {
            selectedIndex = clickedIndex;
            squares[selectedIndex].classList.add('selected');
            playSound('swap');
        } else {
            const prevIndex = selectedIndex;
            squares[prevIndex].classList.remove('selected');

            const isAdjacent = 
                clickedIndex === prevIndex - 1 && prevIndex % width !== 0 ||
                clickedIndex === prevIndex + 1 && prevIndex % width !== width - 1 ||
                clickedIndex === prevIndex - width ||
                clickedIndex === prevIndex + width;

            if (isAdjacent) {
                swapTiles(prevIndex, clickedIndex);
                playSound('swap');
                
                setTimeout(() => {
                    let matches = checkValidMatches();
                    if (matches.length > 0) {
                        moves--;
                        movesDisplay.innerText = moves;
                        processMatches();
                    } else {
                        swapTiles(prevIndex, clickedIndex);
                    }
                }, 200);
            }
            selectedIndex = null;
        }
    }

    function swapTiles(i1, i2) {
        const tempCandy = squares[i1].dataset.candy;
        const tempImg = squares[i1].querySelector('img').src;

        squares[i1].dataset.candy = squares[i2].dataset.candy;
        squares[i1].querySelector('img').src = squares[i2].querySelector('img').src;

        squares[i2].dataset.candy = tempCandy;
        squares[i2].querySelector('img').src = tempImg;
    }

    function checkValidMatches() {
        let matchedIndices = [];

        // Check rows
        for (let r = 0; r < width; r++) {
            for (let c = 0; c < width - 2; c++) {
                let idx = r * width + c;
                let val = squares[idx].dataset.candy;
                if (val && squares[idx + 1].dataset.candy === val && squares[idx + 2].dataset.candy === val) {
                    matchedIndices.push(idx, idx + 1, idx + 2);
                }
            }
        }

        // Check columns
        for (let c = 0; c < width; c++) {
            for (let r = 0; r < width - 2; r++) {
                let idx = r * width + c;
                let val = squares[idx].dataset.candy;
                if (val && squares[idx + width].dataset.candy === val && squares[idx + width * 2].dataset.candy === val) {
                    matchedIndices.push(idx, idx + width, idx + width * 2);
                }
            }
        }

        return [...new Set(matchedIndices)];
    }

    function processMatches() {
        isProcessing = true;
        let matches = checkValidMatches();

        if (matches.length > 0) {
            playSound('match');
            if (matches.length >= 4) {
                playSound('special');
            }

            matches.forEach(idx => {
                squares[idx].dataset.candy = '';
                squares[idx].querySelector('img').src = '';
                score += 15;
            });
            scoreDisplay.innerText = score;

            setTimeout(() => {
                moveDown();
                setTimeout(() => {
                    let chainedMatches = checkValidMatches();
                    if (chainedMatches.length > 0) {
                        processMatches();
                    } else {
                        isProcessing = false;
                        checkGameStatus();
                    }
                }, 250);
            }, 250);
        } else {
            isProcessing = false;
            checkGameStatus();
        }
    }

    function moveDown() {
        const config = levelsConfig[currentLevel - 1];
        let numTypes = config ? config.tileTypes : 6;

        for (let c = 0; c < width; c++) {
            for (let r = width - 1; r >= 0; r--) {
                let idx = r * width + c;
                if (squares[idx].dataset.candy === '') {
                    let found = false;
                    for (let aboveR = r - 1; aboveR >= 0; aboveR--) {
                        let aboveIdx = aboveR * width + c;
                        if (squares[aboveIdx].dataset.candy !== '') {
                            squares[idx].dataset.candy = squares[aboveIdx].dataset.candy;
                            squares[idx].querySelector('img').src = squares[aboveIdx].querySelector('img').src;
                            squares[aboveIdx].dataset.candy = '';
                            squares[aboveIdx].querySelector('img').src = '';
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        let randomCandy = Math.floor(Math.random() * numTypes);
                        squares[idx].dataset.candy = randomCandy;
                        squares[idx].querySelector('img').src = candyImages[randomCandy];
                    }
                }
            }
        }
    }

    // Boosters functionality
    rocketBoosterBtn.addEventListener('click', () => {
        if (rocketCount <= 0 || isProcessing) return;
        activeBooster = (activeBooster === 'rocket') ? null : 'rocket';
        updateBoosterUI();
        playSound('swap');
    });

    bombBoosterBtn.addEventListener('click', () => {
        if (bombCount <= 0 || isProcessing) return;
        activeBooster = (activeBooster === 'bomb') ? null : 'bomb';
        updateBoosterUI();
        playSound('swap');
    });

    function updateBoosterUI() {
        rocketBoosterBtn.classList.toggle('active', activeBooster === 'rocket');
        bombBoosterBtn.classList.toggle('active', activeBooster === 'bomb');
    }

    function updateBoosterCounts() {
        rocketCountDisplay.innerText = rocketCount;
        bombCountDisplay.innerText = bombCount;
    }

    function useBoosterOnTile(idx) {
        isProcessing = true;
        playSound('booster');
        let row = Math.floor(idx / width);
        let col = idx % width;
        let cleared = [];

        if (activeBooster === 'rocket') {
            rocketCount--;
            // Clear entire row
            for (let c = 0; c < width; c++) {
                cleared.push(row * width + c);
            }
        } else if (activeBooster === 'bomb') {
            bombCount--;
            // Clear 3x3 area
            for (let r = Math.max(0, row - 1); r <= Math.min(width - 1, row + 1); r++) {
                for (let c = Math.max(0, col - 1); c <= Math.min(width - 1, col + 1); c++) {
                    cleared.push(r * width + c);
                }
            }
        }

        cleared.forEach(i => {
            squares[i].dataset.candy = '';
            squares[i].querySelector('img').src = '';
            score += 20;
        });
        scoreDisplay.innerText = score;

        activeBooster = null;
        updateBoosterUI();
        updateBoosterCounts();

        setTimeout(() => {
            moveDown();
            setTimeout(() => {
                isProcessing = false;
                checkGameStatus();
            }, 250);
        }, 250);
    }

    function checkGameStatus() {
        if (score >= targetScore) {
            alert(`🎉 Level ${currentLevel} Complete!`);
            if (currentLevel >= maxUnlockedLevel && currentLevel < 500) {
                maxUnlockedLevel = currentLevel + 1;
                localStorage.setItem('mars_match_max_level', maxUnlockedLevel);
            }
            renderLevelMap();
            gameScreen.classList.add('hidden');
            levelMapScreen.classList.remove('hidden');
        } else if (moves <= 0) {
            alert(`Game Over! Score: ${score}. Try Again!`);
            loadLevel(currentLevel);
        }
    }

    // Toggle Sound & Music
    function toggleSound() {
        soundEnabled = !soundEnabled;
        const icon = soundEnabled ? '🔊' : '🔇';
        soundToggleMap.innerText = icon;
        soundToggleGame.innerText = icon;

        if (soundEnabled) {
            bgMusic.play().catch(e => {});
        } else {
            bgMusic.pause();
        }
    }

    soundToggleMap.addEventListener('click', toggleSound);
    soundToggleGame.addEventListener('click', toggleSound);

    mapBtn.addEventListener('click', () => {
        renderLevelMap();
        gameScreen.classList.add('hidden');
        levelMapScreen.classList.remove('hidden');
    });

    restartBtn.addEventListener('click', () => {
        loadLevel(currentLevel);
    });

    // Initial Setup
    window.addEventListener('DOMContentLoaded', () => {
        generate500Levels();
        renderLevelMap();

        document.body.addEventListener('click', () => {
            if (soundEnabled && bgMusic.paused) {
                bgMusic.play().catch(e => {});
            }
        }, { once: true });
    });
</script>
